<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">prompt-test — four browser experiments, each grown from a single prompt</title>
  <desc id="d">A dark viewport strip holding four render frames: layered slabs, a strategy grid, an obstacle course, and a lamplit street canyon.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset="1" stop-color="#12151d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a860"/>
      <stop offset="1" stop-color="#e0703a"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6c07a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#e08a44" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e08a44" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="p1"><rect x="48" y="186" width="258" height="112" rx="8"/></clipPath>
    <clipPath id="p2"><rect x="330" y="186" width="258" height="112" rx="8"/></clipPath>
    <clipPath id="p3"><rect x="612" y="186" width="258" height="112" rx="8"/></clipPath>
    <clipPath id="p4"><rect x="894" y="186" width="258" height="112" rx="8"/></clipPath>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#sky)"/>
  <rect width="1200" height="340" rx="14" fill="url(#grid)"/>

  <!-- viewport corner ticks: the recurring motif, a render target being framed -->
  <g stroke="#f0a860" stroke-width="2" fill="none" stroke-opacity="0.75">
    <path d="M28 46V28h18M1172 46V28h-18M28 294v18h18M1172 294v18h-18"/>
  </g>

  <text x="48" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif"
        font-size="72" font-weight="700" fill="#f2efe9" letter-spacing="-1.5">prompt-test</text>

  <text x="48" y="146" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif"
        font-size="30" font-weight="500" fill="#a8b0bd">Four browser experiments, each grown from a single prompt.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="22" font-weight="600">
    <rect x="48" y="160" width="200" height="0" fill="none"/>
    <text x="1152" y="104" text-anchor="end" fill="#f0a860">4 projects</text>
    <text x="1152" y="140" text-anchor="end" fill="#6b7280">every prompt kept</text>
  </g>

  <!-- ── frame 1 · infra-diorama: five stacked construction stages ───────── -->
  <g clip-path="url(#p1)">
    <rect x="48" y="186" width="258" height="112" fill="#0e1118"/>
    <g fill="#2b3444">
      <rect x="86" y="266" width="182" height="14" rx="2"/>
      <rect x="98" y="248" width="158" height="14" rx="2"/>
      <rect x="110" y="230" width="134" height="14" rx="2"/>
      <rect x="122" y="212" width="110" height="14" rx="2"/>
    </g>
    <rect x="134" y="194" width="86" height="14" rx="2" fill="url(#amber)"/>
  </g>

  <!-- ── frame 2 · empires-rts: a march of territory across a grid ───────── -->
  <g clip-path="url(#p2)">
    <rect x="330" y="186" width="258" height="112" fill="#0e1118"/>
    <g stroke="#28303e" stroke-width="1" fill="none">
      <path d="M330 214h258M330 242h258M330 270h258M388 186v112M446 186v112M504 186v112M562 186v112"/>
    </g>
    <path d="M330 298 L388 270 L446 276 L504 244 L562 250 L588 226" fill="none" stroke="url(#amber)" stroke-width="3"/>
    <g fill="#6fb2d2">
      <circle cx="388" cy="270" r="5"/><circle cx="504" cy="244" r="5"/><circle cx="588" cy="226" r="5"/>
    </g>
  </g>

  <!-- ── frame 3 · call-guys: an obstacle course and a wobbling runner ───── -->
  <g clip-path="url(#p3)">
    <rect x="612" y="186" width="258" height="112" fill="#0e1118"/>
    <path d="M612 288 Q680 258 726 282 T828 258 T870 274" fill="none" stroke="#2b3444" stroke-width="12" stroke-linecap="round"/>
    <g fill="#2b3444">
      <rect x="662" y="214" width="12" height="46" rx="6"/>
      <rect x="746" y="204" width="12" height="56" rx="6"/>
      <rect x="822" y="220" width="12" height="40" rx="6"/>
    </g>
    <g transform="rotate(-11 706 250)">
      <circle cx="706" cy="238" r="11" fill="url(#amber)"/>
      <rect x="700" y="250" width="12" height="20" rx="6" fill="#e0703a"/>
    </g>
  </g>

  <!-- ── frame 4 · night-street: the canyon, its lamps, and the wet road ─── -->
  <g clip-path="url(#p4)">
    <rect x="894" y="186" width="258" height="112" fill="#0e1118"/>
    <path d="M894 186h96v112h-96z" fill="#171c26"/>
    <path d="M1056 186h96v112h-96z" fill="#141922"/>
    <path d="M990 298 L1026 224 L1116 224 L1152 298Z" fill="#0c0f15"/>
    <g fill="#f6c07a" fill-opacity="0.55">
      <rect x="906" y="204" width="12" height="16"/><rect x="936" y="232" width="12" height="16"/>
      <rect x="906" y="258" width="12" height="16"/><rect x="1102" y="212" width="12" height="16"/>
      <rect x="1128" y="248" width="12" height="16"/>
    </g>
    <ellipse cx="1044" cy="252" rx="52" ry="42" fill="url(#lamp)"/>
    <circle cx="1044" cy="236" r="6" fill="#fff3dd"/>
    <path d="M1044 236v34" stroke="#3a4354" stroke-width="3"/>
    <path d="M1030 298 L1044 262 L1058 298Z" fill="#f6c07a" fill-opacity="0.16"/>
  </g>

  <g fill="none" stroke="#2a3140" stroke-width="1">
    <rect x="48" y="186" width="258" height="112" rx="8"/>
    <rect x="330" y="186" width="258" height="112" rx="8"/>
    <rect x="612" y="186" width="258" height="112" rx="8"/>
    <rect x="894" y="186" width="258" height="112" rx="8"/>
  </g>
</svg>
